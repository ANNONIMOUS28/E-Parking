# Plantilla de configuracion de la conexion a MySQL.
#
# Copia este archivo como conexion.properties y ajusta los valores:
#
#   cp conexion.example.properties conexion.properties
#
# conexion.properties NO se versiona, por eso la contrasena real
# nunca queda publicada en el repositorio.
#
# Colocalo en cualquiera de estos dos lugares:
#   - src/main/resources/  (durante el desarrollo)
#   - $CATALINA_HOME/webapps/eparking/WEB-INF/classes/  (desplegado)

db.url=jdbc:mysql://localhost:3306/eparking?useSSL=false&serverTimezone=UTC
db.user=root
db.password=CAMBIAR_ESTA_CONTRASENA
